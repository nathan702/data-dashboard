name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/shared
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Compile Dataform
        working-directory: dataform
        run: npx -y @dataform/cli@3.0.70 compile
