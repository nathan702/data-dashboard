name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/shared
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Compile Dataform
        working-directory: dataform
        run: npx -y @dataform/cli@3.0.70 compile

  # Deploys every push to a deploy branch once the checks pass. Keep the
  # branch list in sync with DEPLOY_BRANCHES in infra/config.sh: Google
  # only accepts GitHub sign-ins from those branches.
  deploy:
    needs: check
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/ecstatic-maxwell-hh3yl3')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets GitHub prove its identity to Google; no stored keys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/679066930064/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: dashboard-deployer@calleva-dashboard.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy
        env:
          DEPLOY_BUILDER: docker
        run: bash infra/deploy.sh
